[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-to-ledger"
version = "0.2.0"
description = "Cost-aware accounting document extraction and expense categorization"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60,<2",
  "pillow>=11,<13",
  "pydantic>=2.8,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[project.scripts]
receipt-to-ledger = "receipt_to_ledger.cli:main"
rtl = "receipt_to_ledger.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
