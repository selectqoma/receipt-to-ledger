[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receipt-to-ledger"
version = "0.1.0"
description = "Cost-aware accounting document extraction and expense categorization"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
